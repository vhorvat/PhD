services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: vhorvat
        USER_UID: 1000
        USER_GID: 1000
    image: ros2-jazzy-dev:latest
    container_name: ros2_jazzy_container
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - ./ros2_ws:/home/vhorvat/ros2_ws
      - ./.tmux.conf:/home/vhorvat/.tmux.conf:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    working_dir: /home/vhorvat/ros2_ws
    command: /bin/bash
