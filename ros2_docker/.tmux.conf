# ==========================================
# Tmux Configuration for ROS 2 Development
# ==========================================

# Enable full mouse support (clicking panes, dragging borders, scrolling)
set -g mouse on

# Terminal colors and scrollback history
set -g default-terminal "screen-256color"
set -g history-limit 50000

# Quick reload shortcut: Press 'Ctrl+b' then 'r' to reload this config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Status bar styling
set -g status-style bg=black,fg=white
set -g status-left-length 20
set -g status-left "#[fg=green][ROS2 Jazzy] "
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%d-%b-%y"
